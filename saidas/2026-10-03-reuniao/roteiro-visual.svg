<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1290" viewBox="0 0 1940 1290"><rect width="1940" height="1290" fill="#faf9f8"/><text x="40" y="58.0" font-family="Arial,sans-serif" font-size="38" fill="#4f4d4e">Psin Clínica | roteiro da reunião</text><text x="40" y="107.0" font-family="Arial,sans-serif" font-size="22" fill="#4f4d4e">Objetivo: escolher uma primeira entrega clara, com responsável e próximo passo.</text><rect x="40" y="160" width="410" height="228" rx="15" fill="#ffffff" stroke="#aaa"/><text x="64" y="204.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">1  ESCUTAR · 0–5 min</text><text x="64" y="229.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="64" y="254.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">O que precisa melhorar primeiro?</text><text x="64" y="279.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Procura, resposta ou agenda?</text><text x="64" y="304.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Qual resultado seria útil?</text><text x="64" y="329.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Quem decide e aprova?</text><rect x="520" y="160" width="410" height="228" rx="15" fill="#eaf3fa" stroke="#aaa"/><text x="544" y="204.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">2  ALINHAR A MARCA · 5–12 min</text><text x="544" y="229.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="544" y="254.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Nome e público prioritário</text><text x="544" y="279.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Equipe ativa e serviços</text><text x="544" y="304.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Particular ou convênios?</text><text x="544" y="329.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Logo original e fotos autorizadas</text><rect x="1000" y="160" width="410" height="228" rx="15" fill="#fce9f0" stroke="#aaa"/><text x="1024" y="204.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">3  MOSTRAR EXEMPLOS · 12–22 min</text><text x="1024" y="229.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="1024" y="254.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Profissionais e ambientes</text><text x="1024" y="279.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Protótipo do site no celular</text><text x="1024" y="304.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Mostrar o contato administrativo</text><text x="1024" y="329.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Perguntar o que representa a clínica</text><rect x="1480" y="160" width="410" height="228" rx="15" fill="#eaf3fa" stroke="#aaa"/><text x="1504" y="204.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">4  FECHAR A FASE 1 · 22–30 min</text><text x="1504" y="229.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="1504" y="254.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Entregas, revisões e aprovações</text><text x="1504" y="279.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Custos e manutenção separados</text><text x="1504" y="304.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Responsáveis e prazo de retorno</text><text x="1504" y="329.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Próximo encontro definido</text><path d="M 456 274.0 H 514 m -10 -6 l 10 6 l -10 6" fill="none" stroke="#777" stroke-width="2"/><path d="M 936 274.0 H 994 m -10 -6 l 10 6 l -10 6" fill="none" stroke="#777" stroke-width="2"/><path d="M 1416 274.0 H 1474 m -10 -6 l 10 6 l -10 6" fill="none" stroke="#777" stroke-width="2"/><text x="40" y="485.0" font-family="Arial,sans-serif" font-size="30" fill="#4f4d4e">Como explicar o projeto por etapas</text><rect x="40" y="530" width="410" height="228" rx="15" fill="#ffffff" stroke="#aaa"/><text x="64" y="574.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">0  DESCOBERTA</text><text x="64" y="599.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="64" y="624.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Entender operação e contratos</text><text x="64" y="649.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Mapear agenda e dados</text><text x="64" y="674.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Validar integrações</text><text x="64" y="699.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Escolher o sistema central</text><rect x="520" y="530" width="410" height="228" rx="15" fill="#fce9f0" stroke="#aaa"/><text x="544" y="574.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">1  PRESENÇA DIGITAL</text><text x="544" y="599.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="544" y="624.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Marca e canais alinhados</text><text x="544" y="649.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Site institucional completo</text><text x="544" y="674.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Contato assistido pela recepção</text><text x="544" y="699.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Conteúdo aprovado pela clínica</text><rect x="1000" y="530" width="410" height="228" rx="15" fill="#eaf3fa" stroke="#aaa"/><text x="1024" y="574.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">2  AGENDA + PAGAMENTO</text><text x="1024" y="599.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="1024" y="624.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Uma agenda oficial</text><text x="1024" y="649.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Regras de reserva e cobrança</text><text x="1024" y="674.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Recorrências e salas</text><text x="1024" y="699.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Testes antes de operar</text><rect x="1480" y="530" width="410" height="228" rx="15" fill="#ffffff" stroke="#aaa"/><text x="1504" y="574.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">3  WHATSAPP</text><text x="1504" y="599.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="1504" y="624.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Respostas administrativas</text><text x="1504" y="649.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Agenda já funcionando</text><text x="1504" y="674.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Encaminhamento humano</text><text x="1504" y="699.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Regras de pausa e falha</text><path d="M 456 644.0 H 514 m -10 -6 l 10 6 l -10 6" fill="none" stroke="#777" stroke-width="2"/><path d="M 936 644.0 H 994 m -10 -6 l 10 6 l -10 6" fill="none" stroke="#777" stroke-width="2"/><path d="M 1416 644.0 H 1474 m -10 -6 l 10 6 l -10 6" fill="none" stroke="#777" stroke-width="2"/><text x="40" y="855.0" font-family="Arial,sans-serif" font-size="30" fill="#4f4d4e">Depois, conforme necessidade e validação</text><rect x="40" y="890" width="410" height="228" rx="15" fill="#ffffff" stroke="#aaa"/><text x="64" y="934.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">4  MIGRAÇÃO CONTROLADA</text><text x="64" y="959.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="64" y="984.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Inventário e exportação</text><text x="64" y="1009.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Conferência com a recepção</text><text x="64" y="1034.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Contingência e treinamento</text><text x="64" y="1059.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Encerrar antigo só após validar</text><rect x="520" y="890" width="410" height="228" rx="15" fill="#ffffff" stroke="#aaa"/><text x="544" y="934.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">5  AQUISIÇÃO E MEDIÇÃO</text><text x="544" y="959.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="544" y="984.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Atendimento e capacidade prontos</text><text x="544" y="1009.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Origem dos contatos</text><text x="544" y="1034.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Agendamentos e comparecimento</text><text x="544" y="1059.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Metas após medir a situação atual</text><rect x="1000" y="890" width="410" height="228" rx="15" fill="#ffffff" stroke="#aaa"/><text x="1024" y="934.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">6  ÁREA DO PACIENTE</text><text x="1024" y="959.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="1024" y="984.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Avaliar uma área web primeiro</text><text x="1024" y="1009.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">App depende de uso e orçamento</text><text x="1024" y="1034.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Mesmo sistema de agenda</text><text x="1024" y="1059.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Decisão com escopo próprio</text><rect x="1480" y="890" width="410" height="228" rx="15" fill="#fce9f0" stroke="#aaa"/><text x="1504" y="934.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">DECISÕES A REGISTRAR</text><text x="1504" y="959.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e"></text><text x="1504" y="984.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Nome, público e equipe</text><text x="1504" y="1009.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Contato e domínio da clínica</text><text x="1504" y="1034.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Quem aprova e quem atualiza</text><text x="1504" y="1059.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Fase escolhida e próximos passos</text><text x="40" y="1197.0" font-family="Arial,sans-serif" font-size="22" fill="#4f4d4e">Lembrete para apresentar: os materiais são propostas; a agenda e o WhatsApp ainda não estão integrados.</text><text x="40" y="1240.0" font-family="Arial,sans-serif" font-size="20" fill="#4f4d4e">Base: três documentos em dados/ · 3 de outubro de 2026 · Sem preços ou prazos de implantação presumidos.</text></svg>